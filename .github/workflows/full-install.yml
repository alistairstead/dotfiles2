name: Full Install

# Per-push CI installs 22 of 78 formulae and skips scripts/macos-setup.sh, so a
# formula that resolves but fails to build, and every line of the macOS setup,
# stay unverified there. This installs the real formula list and runs the real
# macOS setup, weekly rather than per-push because it is slow.
#
# Formulae and casks together take about five minutes, so both are installed.
# Mac App Store entries are skipped: they need a signed-in Apple ID, and
# brew bundle waits on one indefinitely instead of failing. The first run of
# this workflow sat on a single mas line for 95 minutes before being cancelled.

on:
  schedule:
    # Mondays, 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  full-install:
    name: Full install on macOS Latest
    runs-on: macos-latest
    # Formulae only should be well inside this; a hang should fail, not linger
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          echo "CI=true" >> $GITHUB_ENV
          # Tells install.sh to use the real Brewfile and run macos-setup.sh
          echo "DOTFILES_FULL_INSTALL=1" >> $GITHUB_ENV

      - name: Tap and trust what the Brewfile declares
        run: |
          # Doubles as the resolution check: with CI set this taps and trusts
          # every declared tap, which brew bundle then needs to install from.
          ./scripts/check-brewfile.sh

      - name: Record versions
        run: |
          echo "macOS:  $(sw_vers -productVersion)"
          echo "zsh:    $(zsh --version)"
          echo "bash:   $(/bin/bash --version | head -1)"
          echo "brew:   $(brew --version | head -1)"

      - name: Run installation script
        run: |
          # Mac App Store installs need a signed-in Apple ID, which a runner
          # does not have; brew bundle waits on it indefinitely rather than
          # failing. The skip list is space-separated, so an app whose name
          # contains spaces can only be matched by its id. Homebrew's skipper
          # checks name or id for exactly this reason.
          HOMEBREW_BUNDLE_MAS_SKIP="$(sed -n 's/^mas .*id: *\([0-9][0-9]*\).*/\1/p' Brewfile | tr '\n' ' ')"
          export HOMEBREW_BUNDLE_MAS_SKIP
          echo "Skipping App Store ids: ${HOMEBREW_BUNDLE_MAS_SKIP:-none}"

          chmod +x install.sh
          ./install.sh

      - name: Check the install did not write into the repo
        if: always()
        run: |
          # macos-setup.sh appends to shell config, and ~/.zshenv and ~/.config
          # are stow symlinks into this checkout.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the full install modified tracked files"
            git status --porcelain
            git diff
            exit 1
          fi
          echo "Working tree is clean after install"

      - name: Validate installation
        run: ./.github/test/validate.sh

      - name: Report what got installed
        if: always()
        run: |
          {
            echo "### Installed"
            echo "- formulae: $(brew list --formula | wc -l | tr -d ' ') installed, $(grep -c '^brew ' Brewfile) declared"
            echo "- casks: $(brew list --cask | wc -l | tr -d ' ') installed, $(grep -c '^cask ' Brewfile) declared"
            echo ""
            echo "$(grep -c '^mas ' Brewfile) App Store app(s) skipped; a runner has no Apple ID."
          } >> "$GITHUB_STEP_SUMMARY"
